<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Background Badge -->
  <rect width="128" height="128" rx="28" fill="#0f172a"/>
  
  <!-- Outer Border -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- 2D Connector Line -->
  <path d="M 48 46 H 72 V 82 H 84" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="48" cy="46" r="4" fill="#38bdf8"/>
  <circle cx="84" cy="82" r="4" fill="#818cf8"/>

  <!-- Top-Left Table Node (Primary) -->
  <g transform="translate(18, 22)">
    <rect width="48" height="48" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="48" height="14" rx="5" fill="#38bdf8"/>
    <rect x="6" y="4" width="16" height="6" rx="2" fill="#0f172a"/>
    <line x1="0" y1="14" x2="48" y2="14" stroke="#334155" stroke-width="1.5"/>
    <!-- Rows -->
    <rect x="6" y="20" width="24" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="6" y="28" width="30" height="4" rx="2" fill="#94a3b8"/>
    <rect x="6" y="36" width="20" height="4" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Bottom-Right Table Node (Related) -->
  <g transform="translate(62, 58)">
    <rect width="48" height="48" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <rect width="48" height="14" rx="5" fill="#818cf8"/>
    <rect x="6" y="4" width="20" height="6" rx="2" fill="#ffffff"/>
    <line x1="0" y1="14" x2="48" y2="14" stroke="#334155" stroke-width="1.5"/>
    <!-- Rows -->
    <rect x="6" y="20" width="18" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="6" y="28" width="28" height="4" rx="2" fill="#94a3b8"/>
    <rect x="6" y="36" width="22" height="4" rx="2" fill="#94a3b8"/>
  </g>
</svg>
